# Render Blueprint: deploys the Express API as a free web service.
# In Render: New > Blueprint > pick this repo, then paste CONNECTION_URL.
services:
  - type: web
    name: mern-quiz-app-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CONNECTION_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://saravanan-22.github.io,http://localhost:3000
