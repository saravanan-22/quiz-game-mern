name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/deploy-client.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: false
          # Set in repo Settings > Secrets and variables > Actions > Variables
          REACT_APP_API_URL: ${{ vars.API_URL }}
      # GitHub Pages serves 404.html for unknown paths, so deep links like
      # /quiz-game-mern/Home still load the React app.
      - run: cp build/index.html build/404.html && touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
